name: Observed

on:
  pull_request:

permissions:
  contents: read
  checks: write         # title this job's check with the verdict
  pull-requests: write  # post and update one comment

concurrency:
  group: observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observed:
    name: Observed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: esau-morais/observed@5d5f5d5748776415104951226aadf2a4c8c275fd # v0.2.0-alpha.1
        with:
          project: "."
          base: ${{ github.event.pull_request.base.sha }}
