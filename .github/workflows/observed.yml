name: Observed

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observed:
    name: Observed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: esau-morais/observed@c76c6103ae10f2f3df2947634a85b15dcae89cee # feat/workflow-token-delivery, unreleased
        env:
          OBSERVED_FROM_SOURCE: true
        with:
          project: .
          base: ${{ github.event.pull_request.base.sha }}

