name: Observed

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observed:
    name: Observed
    strategy:
      fail-fast: false
      matrix:
        app: [app, app-missing-key]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: esau-morais/observed@ff00791ab336803a31c486213e2c4a5522f3e09f # feat/workflow-token-delivery, unreleased
        env:
          OBSERVED_FROM_SOURCE: true
        with:
          project: .
          base: ${{ github.event.pull_request.base.sha }}
          artifact-name: observed-${{ matrix.app }}
          github-app-client-id: ${{ vars.OBSERVED_APP_CLIENT_ID }}
          github-app-private-key: ${{ matrix.app == 'app' && secrets.OBSERVED_APP_PRIVATE_KEY || secrets.OBSERVED_KEY_NEVER_STORED }}
